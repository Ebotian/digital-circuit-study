# clang-tidy policy for this repository.
# `make tidy` uses this file; clice has its own checks and does not read it.
#
# Excluded on purpose:
# - signed-bitwise: truth-table words are integer bit masks;
# - command-processor: yosys/verilator/node/rsvg run as subprocesses;
# - easily-swappable-parameters: small internal helpers, call sites reviewed;
# - inefficient-string-concatenation: expression builders favour readability;
# - enum-size: enums are internal/API contracts; int base avoids casts.
Checks: "-*,clang-analyzer-*,bugprone-*,performance-*,-bugprone-signed-bitwise,-bugprone-command-processor,-bugprone-easily-swappable-parameters,-performance-inefficient-string-concatenation,-performance-enum-size"
WarningsAsErrors: ''
