# clang-tidy policy for this repository.
# `make tidy` uses this file; clice has its own checks and does not read it.
# All checks are enabled; intentional exceptions are marked locally with
# NOLINT(<check>) and a reason next to the code they apply to.
Checks: "-*,clang-analyzer-*,bugprone-*,performance-*,readability-magic-numbers"
WarningsAsErrors: ''
